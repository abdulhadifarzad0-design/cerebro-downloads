  <rect width="100" height="100" rx="23" fill="url(#tile)"/>
  <circle cx="50" cy="50" r="27" fill="url(#glow)"/>
  <circle cx="50" cy="50" r="33.5" fill="none" stroke="url(#ring)" stroke-width="9"/>
  <circle cx="50" cy="50" r="14" fill="url(#core)"/>
  <ellipse cx="45.5" cy="44.5" rx="5" ry="3" fill="#fff" opacity=".42"/>
