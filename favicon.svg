<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16161a"/>
      <stop offset="1" stop-color="#070708"/>
    </linearGradient>
    <linearGradient id="ring" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".32" stop-color="#d6d7da"/>
      <stop offset=".52" stop-color="#7f8187"/>
      <stop offset=".74" stop-color="#eceded"/>
      <stop offset="1" stop-color="#9a9ca1"/>
    </linearGradient>
    <radialGradient id="core" cx=".4" cy=".36" r=".72">
      <stop offset="0" stop-color="#ffb1bb"/>
      <stop offset=".28" stop-color="#ff3550"/>
      <stop offset=".75" stop-color="#d01a36"/>
      <stop offset="1" stop-color="#8f1024"/>
    </radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
